
  name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          script: |
            cd ~/entity-extract
            git pull origin main
            docker stop entity-extract-app || true
            docker rm entity-extract-app || true
            docker build -t entity-extract .
            docker run -d \
              --name entity-extract-app \
              --restart unless-stopped \
              -p 80:8000 \
              entity-extract       
